media:
  - name: publications_files
    label: Publications files
    input: public/publications_files
    output: /publications_files
    categories: [document]

  - name: robot_images
    label: Robot images
    input: public/robot_images
    output: /robot_images
    categories: [image]

  - name: news_images
    label: News images
    input: public/news_images
    output: /news_images
    categories: [image]

content:
  # Publications Page Configuration
  - name: publicationsPage
    label: Publications Page
    type: file
    path: src/data/publications.json
    format: json
    fields:
      - name: publicationsPageTitle
        label: Publications Page Title
        type: string
        required: true

      - name: publicationsPageSubtitle
        label: Publications Page Subtitle
        type: rich-text
        required: true

      - name: publications
        label: Publications List
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} - {fields.sectionTitle}"
        fields:
          - name: sectionTitle
            label: Section Title
            type: string
            required: true

          - name: years
            label: Years
            type: block
            list:
              collapsible:
                collapsed: true
                summary: "#{index} - {fields.year}"
            blockKey: year
            blocks:
              - name: year
                label: Year
                fields:
                  - name: year
                    label: Year
                    type: string
                    required: true

                  - name: papers
                    label: Papers
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "#{index} — {fields.title}"
                    fields:
                      - name: title
                        label: Paper Title
                        type: string
                        required: true

                      - name: journal
                        label: Journal / Conference
                        type: string

                      - name: volume
                        label: Volume
                        type: string

                      - name: issue
                        label: Issue
                        type: string

                      - name: page
                        label: Page / Article Number
                        type: string

                      - name: authors
                        label: Authors
                        type: object
                        list: true
                        fields:
                          - name: name
                            label: Author Name
                            type: string
                            required: true

                          - name: link
                            label: Author Link
                            type: string

                      - name: links
                        label: Paper Links
                        type: object
                        list: true
                        fields:
                          - name: type
                            label: Link Type
                            type: string
                            required: true

                          - name: url
                            label: URL
                            type: string
                            required: true

                      - name: keywords
                        label: Keywords
                        type: string
                        list: true

                      - name: highlights
                        label: Highlights
                        type: rich-text
                        list: true

                      - name: abstract
                        label: Abstract
                        type: rich-text

                      - name: citationLink
                        label: Citation Key
                        type: string

                      - name: citation
                        label: Citation (BibTeX)
                        type: text
              

  # Robots Page Configuration
  - name: robotsPage
    label: Robots Page
    type: file
    path: src/data/robots.json
    format: json
    fields:
      - name: robotPageTitle
        label: Robot Page Title
        type: string
        required: true

      - name: robotPageSubtitle
        label: Robot Page Subtitle
        type: rich-text
        required: true

      - name: robots
        label: Robots
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.robotsTitle}"
        fields:
          - name: robotsTitle
            label: Title
            type: string
            required: true

          - name: robotsPic
            label: Image
            type: image
            required: true
            options:
              media: robot_images

          - name: robotsData
            label: Description
            type: rich-text
            required: true

  # News Page Configuration
  - name: newsPage
    label: News Page
    type: file
    path: src/data/news.json
    format: json
    fields:
      - name: newsPageTitle
        label: News Page Title
        type: string
        required: true

      - name: newsPageSubtitle
        label: News Page Subtitle
        type: rich-text
        required: true

      - name: news
        label: News Items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.newsTitle} — {fields.newsDate}"
        fields:
          - name: newsTitle
            label: Title
            type: string
            required: true

          - name: newsDate
            label: Date
            type: string
            required: true
            description: "Format: Month Day, Year (e.g. November 12, 2025)"

          - name: newsPic
            label: Image
            type: image
            required: true
            options:
              media: news_images

          - name: newsData
            label: Content
            type: rich-text
            required: true

  # Join Us Page Configuration
  - name: joinUsPage
    label: Join Us Page
    type: file
    path: src/data/joinus.json
    format: json
    fields:
      - name: joinusPageTitle
        label: Join Us Page Title
        type: string
        required: true

      - name: joinusPageSubtitle
        label: Join Us Page Subtitle
        type: rich-text
        required: true

      - name: joinus
        label: Join Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.joinusTitle}"
        fields:
          - name: joinusTitle
            label: Section Title
            type: string
            required: true

          - name: joinusData
            label: Content Blocks
            type: block 
            list: 
              collapsible:
                collapsed: true
                summary: "#{index} — {fields.type}"
            blockKey: type
            blocks:
              - name: paragraph
                label: Paragraph
                fields:
                  - name: text
                    label: Paragraph Text
                    type: rich-text
                    required: true

              - name: bullet-list
                label: Bullet List
                fields:
                  - name: items
                    label: Bullet Items
                    type: rich-text
                    list: true
                    required: true


  # Teaching Page Configuration
  - name: teachingPage
    label: Teaching Page
    type: file
    path: src/data/teachings.json
    format: json
    fields:
      - name: teachingPageTitle
        label: Teaching Page Title
        type: string
        required: true

      - name: teachingPageSubtitle
        label: Teaching Page Subtitle
        type: rich-text
        required: true

      - name: teachings
        label: Teaching Courses
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.teachingsTitle}"
        fields:
          - name: teachingsTitle
            label: Course Title
            type: string
            required: true

          - name: teachingsData
            label: Course Description
            type: rich-text
            required: true