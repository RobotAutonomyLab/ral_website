media:
  - name: robot_images
    label: Robot images
    input: public/robot_images
    output: /robot_images
    categories: [image]

  - name: news_images
    label: News images
    input: public/news_images
    output: /news_images
    categories: [image]

content:
  # Robots Page Configuration
  - name: robotsPage
    label: Robots Page
    type: file
    path: src/data/robots.json
    format: json
    fields:
      - name: robotPageTitle
        label: Robot Page Title
        type: string
        required: true

      - name: robotPageSubtitle
        label: Robot Page Subtitle
        type: rich-text
        required: true

      - name: robots
        label: Robots
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.robotsTitle}"
        fields:
          - name: robotsTitle
            label: Title
            type: string
            required: true

          - name: robotsPic
            label: Image
            type: image
            required: true
            options:
              media: robot_images

          - name: robotsData
            label: Description
            type: rich-text
            required: true

  # News Page Configuration
  - name: newsPage
    label: News Page
    type: file
    path: src/data/news.json
    format: json
    fields:
      - name: newsPageTitle
        label: News Page Title
        type: string
        required: true

      - name: newsPageSubtitle
        label: News Page Subtitle
        type: rich-text
        required: true

      - name: news
        label: News Items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.newsTitle} — {fields.newsDate}"
        fields:
          - name: newsTitle
            label: Title
            type: string
            required: true

          - name: newsDate
            label: Date
            type: string
            required: true
            description: "Format: Month Day, Year (e.g. November 12, 2025)"

          - name: newsPic
            label: Image
            type: image
            required: true
            options:
              media: news_images

          - name: newsData
            label: Content
            type: rich-text
            required: true

  # Join Us Page Configuration
  - name: joinUsPage
    label: Join Us Page
    type: file
    path: src/data/joinus.json
    format: json
    fields:
      - name: joinusPageTitle
        label: Join Us Page Title
        type: string
        required: true

      - name: joinusPageSubtitle
        label: Join Us Page Subtitle
        type: rich-text
        required: true

      - name: joinus
        label: Join Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.joinusTitle}"
        fields:
          - name: joinusTitle
            label: Section Title
            type: string
            required: true

          - name: joinusData
            label: Content Blocks
            type: block  # <--- CHANGED from 'object' to 'block'
            list: true   # Keep this true so you can have multiple blocks
            blockKey: type # This tells PagesCMS to use your existing "type" field to save the choice
            blocks:
              - name: paragraph
                label: Paragraph
                fields:
                  - name: text
                    label: Paragraph Text
                    type: rich-text
                    required: true

              - name: bullet-list
                label: Bullet List
                fields:
                  - name: items
                    label: Bullet Items
                    type: string
                    list: true
                    required: true


  # Teaching Page Configuration
  - name: teachingPage
    label: Teaching Page
    type: file
    path: src/data/teachings.json
    format: json
    fields:
      - name: teachingPageTitle
        label: Teaching Page Title
        type: string
        required: true

      - name: teachingPageSubtitle
        label: Teaching Page Subtitle
        type: rich-text
        required: true

      - name: teachings
        label: Teaching Courses
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.teachingsTitle}"
        fields:
          - name: teachingsTitle
            label: Course Title
            type: string
            required: true

          - name: teachingsData
            label: Course Description
            type: rich-text
            required: true