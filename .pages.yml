media:
  - name: news_images
    label: News images
    input: public/news_images
    output: /news_images
    categories: [image]

  - name: robot_images
    label: Robot images
    input: public/robot_images
    output: /robot_images
    categories: [image]

# News Page Configuration
content:
  - name: news
    label: News
    type: file
    path: src/data/news.json
    list: true

    fields:
      - name: newsTitle
        label: Title
        type: string
        required: true
        
      - name: newsDate
        label: Date
        type: string
        required: true
        description: "Format: Month Day, Year (e.g. November 12, 2025)"
        
      - name: newsPic
        label: Image
        type: image
        required: true
        options:
          media: news_images
        
      - name: newsData
        label: Content
        type: rich-text
        required: true