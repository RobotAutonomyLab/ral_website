media:
  - name: robot_images
    label: Robot images
    input: public/robot_images
    output: /robot_images
    categories: [image]

  - name: news_images
    label: News images
    input: public/news_images
    output: /news_images
    categories: [image]

content:
  # News Page (single file, with nested list)
  - name: newsPage
    label: News Page
    type: file
    path: src/data/news.json
    format: json
    fields:
      - name: newsPageTitle
        label: News Page Title
        type: string
        required: true

      - name: newsPageSubtitle
        label: News Page Subtitle
        type: rich-text
        required: true

      - name: news
        label: News Items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.newsTitle} — {fields.newsDate}"
        fields:
          - name: newsTitle
            label: Title
            type: string
            required: true

          - name: newsDate
            label: Date
            type: string
            required: true
            description: "Format: Month Day, Year (e.g. November 12, 2025)"

          - name: newsPic
            label: Image
            type: image
            required: true
            options:
              media: news_images

          - name: newsData
            label: Content
            type: rich-text
            required: true

  # Robots Page (single file, with nested list)
  - name: robotsPage
    label: Robots Page
    type: file
    path: src/data/robots.json
    format: json
    fields:
      - name: robotPageTitle
        label: Robot Page Title
        type: string
        required: true

      - name: robotPageSubtitle
        label: Robot Page Subtitle
        type: rich-text
        required: true

      - name: robots
        label: Robots
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.robotsTitle}"
        fields:
          - name: robotsTitle
            label: Title
            type: string
            required: true

          - name: robotsPic
            label: Image
            type: image
            required: true
            options:
              media: robot_images

          - name: robotsData
            label: Description
            type: rich-text
            required: true
