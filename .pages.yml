media:
  - name: out_team_files
    label: Our team files
    input: public/our_team_files
    output: /public/our_team_files
    categories: [document, image]

  - name: publications_files
    label: Publications files
    input: public/publications_files
    output: /public/publications_files
    categories: [document]

  - name: robot_images
    label: Robot images
    input: public/robot_images
    output: /robot_images
    categories: [image]

  - name: news_images
    label: News images
    input: public/news_images
    output: /news_images
    categories: [image]

content:
  # Our Team Page Configuration
  - name: ourTeamPage
    label: Our Team Page
    type: file
    path: src/data/ourteam.json
    format: json
    fields:
      - name: ourTeamPageTitle
        label: Our Team Page Title
        type: string
        required: true

      - name: ourTeamPageSubtitle
        label: Our Team Page Subtitle
        type: rich-text
        required: true

      - name: ourTeam
        label: Our Team
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} - {fields.sectionTitle}"
        fields:
          - name: sectionTitle
            label: Section Title
            type: string
            required: true

          - name: teamMembers
            label: Team Members
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.Name}"
            fields:
              - name: ProfileName
                label: Profile Name
                type: string
                required: true

              - name: ProfileLink
                label: Profile Link
                type: string
                required: true
              
              - name: ProfilePic
                label: Profile Picture
                type: image
                required: true
                options:
                  media: our_team_files

              - name: Name
                label: Full Name
                type: string
                required: true

  # Publications Page Configuration
  - name: publicationsPage
    label: Publications Page
    type: file
    path: src/data/publications.json
    format: json
    fields:
      - name: publicationsPageTitle
        label: Publications Page Title
        type: string
        required: true

      - name: publicationsPageSubtitle
        label: Publications Page Subtitle
        type: rich-text
        required: true

      - name: publications
        label: Publications List
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} - {fields.sectionTitle}"
        fields:
          - name: sectionTitle
            label: Section Title
            type: string
            required: true

          - name: years
            label: Years
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.year}"
            fields:
              - name: year
                label: Year
                type: string
                required: true

              - name: papers
                label: Papers
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "#{index} — {fields.title}"
                fields:
                  - name: title
                    label: Title
                    type: string
                    required: true

                  - name: journal
                    label: Journal
                    type: string
                    required: false

                  - name: volume
                    label: Volume
                    type: string
                    required: false

                  - name: issue
                    label: Issue
                    type: string
                    required: false

                  - name: page
                    label: Page
                    type: string
                    required: false

                  - name: authors
                    label: Authors
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "#{index} — {fields.name}"
                    fields:
                      - name: name
                        label: Name
                        type: string
                        required: true

                      - name: link
                        label: Link
                        type: string
                        required: false

                  - name: links
                    label: Links
                    type: block
                    list:
                      collapsible:
                        collapsed: true
                        summary: "#{index} — {fields.type}"
                    blockKey: type
                    blocks:
                      - name: PDF
                        label: PDF
                        fields:
                          - name: url
                            label: PDF File
                            type: file
                            required: true
                            options:
                              media: publications_files

                      - name: Cite
                        label: Cite (No action needed — URL set automatically!)
                        fields:
                          - name: url
                            label: URL
                            type: string
                            required: true
                            default: "/"
                            hidden: true

                      - name: DOI
                        label: DOI
                        fields:
                          - name: url
                            label: URL
                            type: string
                            required: true

                      - name: Code
                        label: Code
                        fields:
                          - name: url
                            label: URL
                            type: string
                            required: true

                      - name: Video
                        label: Video
                        fields:
                          - name: url
                            label: URL
                            type: string
                            required: true

                      - name: Data
                        label: Data
                        fields:
                          - name: url
                            label: URL
                            type: string
                            required: true

                  - name: keywords
                    label: Keywords
                    type: string
                    list: true
                    required: false

                  - name: highlights
                    label: Highlights
                    type: string
                    list: true
                    required: false

                  - name: abstract
                    label: Abstract
                    type: text
                    required: false

                  - name: citation
                    label: Citation
                    type: text
                    required: false

  # Robots Page Configuration
  - name: robotsPage
    label: Robots Page
    type: file
    path: src/data/robots.json
    format: json
    fields:
      - name: robotPageTitle
        label: Robot Page Title
        type: string
        required: true

      - name: robotPageSubtitle
        label: Robot Page Subtitle
        type: rich-text
        required: true

      - name: robots
        label: Robots
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.robotsTitle}"
        fields:
          - name: robotsTitle
            label: Title
            type: string
            required: true

          - name: robotsPic
            label: Image
            type: image
            required: true
            options:
              media: robot_images

          - name: robotsData
            label: Description
            type: rich-text
            required: true

  # News Page Configuration
  - name: newsPage
    label: News Page
    type: file
    path: src/data/news.json
    format: json
    fields:
      - name: newsPageTitle
        label: News Page Title
        type: string
        required: true

      - name: newsPageSubtitle
        label: News Page Subtitle
        type: rich-text
        required: true

      - name: news
        label: News Items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.newsTitle} — {fields.newsDate}"
        fields:
          - name: newsTitle
            label: Title
            type: string
            required: true

          - name: newsDate
            label: Date
            type: string
            required: true
            description: "Format: Month Day, Year (e.g. November 12, 2025)"

          - name: newsPic
            label: Image
            type: image
            required: true
            options:
              media: news_images

          - name: newsData
            label: Content
            type: rich-text
            required: true

  # Join Us Page Configuration
  - name: joinUsPage
    label: Join Us Page
    type: file
    path: src/data/joinus.json
    format: json
    fields:
      - name: joinusPageTitle
        label: Join Us Page Title
        type: string
        required: true

      - name: joinusPageSubtitle
        label: Join Us Page Subtitle
        type: rich-text
        required: true

      - name: joinus
        label: Join Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.joinusTitle}"
        fields:
          - name: joinusTitle
            label: Section Title
            type: string
            required: true

          - name: joinusData
            label: Content Blocks
            type: block 
            list: 
              collapsible:
                collapsed: true
                summary: "#{index} — {fields.type}"
            blockKey: type
            blocks:
              - name: paragraph
                label: Paragraph
                fields:
                  - name: text
                    label: Paragraph Text
                    type: rich-text
                    required: true

              - name: bullet-list
                label: Bullet List
                fields:
                  - name: items
                    label: Bullet Items
                    type: rich-text
                    list: true
                    required: true


  # Teaching Page Configuration
  - name: teachingPage
    label: Teaching Page
    type: file
    path: src/data/teachings.json
    format: json
    fields:
      - name: teachingPageTitle
        label: Teaching Page Title
        type: string
        required: true

      - name: teachingPageSubtitle
        label: Teaching Page Subtitle
        type: rich-text
        required: true

      - name: teachings
        label: Teaching Courses
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "#{index} — {fields.teachingsTitle}"
        fields:
          - name: teachingsTitle
            label: Course Title
            type: string
            required: true

          - name: teachingsData
            label: Course Description
            type: rich-text
            required: true