media: public/news_images

content:
  - name: news
    label: News
    type: file
    path: src/data/news.json
    list: true
    fields:
      - name: newsTitle
        label: Title
        type: string
        required: true
        
      - name: newsDate
        label: Date
        type: string
        required: true
        description: "Format: Month Day, Year (e.g. November 12, 2025)"
        
      - name: newsPic
        label: Image
        type: image
        required: true
        
      - name: newsData
        label: Content
        type: rich-text
        required: true